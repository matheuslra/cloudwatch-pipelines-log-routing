AWSTemplateFormatVersion: '2010-09-09'
Description: Source and destination log groups for the sample pipeline, each with its own retention, and the pipeline's role

Resources:
  SourceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sample/checkout/source
      RetentionInDays: 1

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sample/checkout/audit
      RetentionInDays: 365

  ErrorsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sample/checkout/errors
      RetentionInDays: 30

  # The default route. Its log group must exist before you create the pipeline.
  DebugLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /sample/checkout/debug
      RetentionInDays: 7

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: process-and-route
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:ProcessWithPipeline
                Resource: !GetAtt SourceLogGroup.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt AuditLogGroup.Arn
                  - !GetAtt ErrorsLogGroup.Arn
                  - !GetAtt DebugLogGroup.Arn

Outputs:
  PipelineRoleArn:
    Value: !GetAtt PipelineRole.Arn
